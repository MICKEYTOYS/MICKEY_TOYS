<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>متجر الألعاب</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #fff8f0; color: #333; }
    header { background: #ff7043; color: white; padding: 24px; text-align: center; }
    main { max-width: 900px; margin: 30px auto; padding: 16px; text-align: center; }
    .card { display: inline-block; background: white; padding: 20px; margin: 10px; border-radius: 12px; }
    button { background: #ff7043; color: white; border: 0; padding: 10px 18px; border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>MICKEY TOYS</h1>
    <p>أFun & Happy Moments for Every Child 🧸✨</p>
  </header>
  <main>
    <h2>ألعابنا</h2>
    <div class="card">
      <h3>لعبة الدب اللطيف</h3>
      <p>هدية جميلة وممتعة للأطفال</p>
      <button>اطلب الآن</button>
    </div>
  </main>
</body>
</html>
